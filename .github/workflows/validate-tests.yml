name: Validate Tests + SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-sonar:
    runs-on: ubuntu-latest
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Sonar configuration
        run: |
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "Variável SONAR_ORGANIZATION não configurada em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Variável SONAR_PROJECT_KEY não configurada em Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "Secret SONAR_TOKEN não configurado em Settings > Secrets and variables > Actions > Secrets"
            exit 1
          fi

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /o:"$SONAR_ORGANIZATION" \
            /k:"$SONAR_PROJECT_KEY" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.newCode.referenceBranch="main" \
            /d:sonar.sources="DominoPontaDeQuina.Core" \
            /d:sonar.inclusions="**/*.cs" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,DominoPontaDeQuina.Tests/**"

      - name: Restore
        run: dotnet restore DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj

      - name: Build
        run: dotnet build DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj --configuration Release --no-restore

      - name: Run BASIC tests (TRX)
        id: run_basic
        continue-on-error: true
        run: |
          mkdir -p TestResults
          dotnet test DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --filter "Categoria=Basico" \
            --logger "trx;LogFileName=basic-tests.trx" \
            --results-directory TestResults

      - name: Run GAP tests (TRX)
        id: run_gap
        continue-on-error: true
        run: |
          mkdir -p TestResults
          dotnet test DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --filter "Categoria=Gap" \
            --logger "trx;LogFileName=gap-tests.trx" \
            --results-directory TestResults

      - name: Run EXCEPTION tests (TRX)
        id: run_exception
        continue-on-error: true
        run: |
          mkdir -p TestResults
          dotnet test DominoPontaDeQuina.Tests/DominoPontaDeQuina.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            --filter "Categoria=Excecao" \
            --logger "trx;LogFileName=exception-tests.trx" \
            --results-directory TestResults

      - name: SonarCloud End
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Consolidated evaluation report (tests + sonar)
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/report_sonar.py

      - name: Test report (Básicos x Gaps x Exceções)
        id: test_report
        shell: bash
        run: |
          BASIC_TRX="TestResults/basic-tests.trx"
          GAP_TRX="TestResults/gap-tests.trx"
          EXCEPTION_TRX="TestResults/exception-tests.trx"

          if [ ! -f "$BASIC_TRX" ] || [ ! -f "$GAP_TRX" ] || [ ! -f "$EXCEPTION_TRX" ]; then
            echo "Arquivos TRX esperados não encontrados."
            echo "basic_failed=1" >> "$GITHUB_OUTPUT"
            echo "gap_failed=1" >> "$GITHUB_OUTPUT"
            echo "exception_failed=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          python3 .github/scripts/report_trx.py

      - name: Upload TRX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: |
            TestResults/basic-tests.trx
            TestResults/gap-tests.trx
            TestResults/exception-tests.trx
          if-no-files-found: warn

      - name: Fail workflow if any test failed
        if: steps.test_report.outputs.basic_failed != '0' || steps.test_report.outputs.gap_failed != '0' || steps.test_report.outputs.exception_failed != '0'
        run: |
          echo "Há falhas nos testes. Gap%: ${{ steps.test_report.outputs.gap_percentage }}"
          exit 1
